[project]
name = "tennisform-backend"
version = "0.1.0"
description = "TennisForm AI backend (feedback module)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=2.2",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: runs real MediaPipe inference and a real decode. Deselect with -m 'not slow'.",
    "gemini_live: calls the real Gemini API. Opt-in; requires GEMINI_API_KEY in the environment.",
    "court_pixels: renders synthetic court frames (T1/T2 tiers). Deselect with -m 'not court_pixels'.",
    "real_clips: runs on local real clips; skipped unless TENNIS_CLIPS_DIRS is set.",
]
