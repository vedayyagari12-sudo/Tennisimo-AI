[project]
name = "tennisform-backend"
version = "0.1.0"
description = "TennisForm AI backend (feedback module)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=2.2",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
