name: tennisimo_ai
description: "Tennisimo AI — swing analysis client."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  supabase_flutter: ^2.3.0
  camera: ^0.11.0
  file_picker: ^13.1.0
  video_player: ^2.11.1
  # Web theme choice only. Already transitive via supabase_flutter; its Android
  # plugin declares no permissions.
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
